<!DOCTYPE html>
<!--
  SPDX-License-Identifier: GPL-3.0-only

  Part of mscz_test. Built on MuseScore-derived code; see vendor/aria/VENDOR.md.

  Drop a .mscz or MusicXML score on the page and it is laid out and drawn, in the browser, with
  nothing going to a server. Serve this directory over HTTP -- the module is an
  ES module, so file:// will not do:

      python3 -m http.server --directory build/web
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>mscz_test — MuseScore / MusicXML in the browser</title>
<style>
  html { overflow-y: scroll; }
  body { font: 14px system-ui, sans-serif; margin: 0; background: #f4f4f5; color: #27272a; }
  header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #d4d4d8;
           display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
           position: sticky; top: 0; left: 0; z-index: 1; }
  #status { color: #71717a; }
  #pages { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px;
           width: max-content; min-width: 100%; box-sizing: border-box; }
  #pages svg { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); width: var(--page-width); height: auto; }
  #drop { padding: 48px; text-align: center; color: #71717a; }
  body.dragging #drop { outline: 2px dashed #52525b; }
  label { display: flex; gap: 4px; align-items: center; }
</style>
</head>
<body>

<header>
  <input type="file" id="file" accept=".mscz,.musicxml,.xml,.mxl" disabled>
  <button id="savePdf" type="button" disabled title="Downloads PDF tools and fonts when needed. Internet connection required.">Save PDF</button>
  <div role="group" aria-label="Display transposition">
    <button id="transposeDown" type="button" disabled>− semitone</button>
    <output id="transposeValue" aria-live="polite">Original key</output>
    <button id="transposeUp" type="button" disabled>+ semitone</button>
    <button id="transposeReset" type="button" disabled>Reset key</button>
    <select id="transposeSpelling" aria-label="Pitch spelling" disabled>
      <option value="readable">Readable spelling</option>
      <option value="preserve">Preserve spelling</option>
    </select>
    <label><input type="checkbox" id="preserveSystemBreaks" checked disabled> Keep layout</label>
  </div>
  <div role="group" aria-label="Score zoom">
    <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
    <output id="zoomValue" aria-live="polite">100%</output>
    <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
    <button id="zoomReset" type="button">Fit width</button>
  </div>
  <label>dpi <input type="number" id="dpi" value="300" min="72" max="1200" step="12" style="width: 5em"></label>
  <label><input type="checkbox" id="pathSymbols" checked> symbols as paths</label>
  <label><input type="checkbox" id="embedFonts" checked> embed font subsets</label>
  <!-- PLAYBACK_BEGIN -->
  <label><input type="checkbox" id="showPlayback" aria-controls="playback" checked> Playback panel</label>
  <!-- PLAYBACK_END -->
  <span id="status">loading the engine…</span>
</header>

<div id="drop">or drop a .mscz, .musicxml, .xml or .mxl here</div>
<div id="pages"></div>

<!-- PLAYBACK_BEGIN -->
<section id="playback" aria-label="Playback">
  <div class="playback-transport"><button id="play" type="button" disabled>Play</button>
  <button id="stop" type="button" disabled>Stop</button>
  <label><input id="followPlayback" type="checkbox" checked> Auto-scroll</label>
  <button id="showMixer" type="button" aria-controls="mixerDialog" aria-expanded="false">Mixer</button>
  <span id="playbackStatus" role="status"></span></div>
  <div class="playback-position"><label>Volume <input id="masterVolume" type="range" min="0" max="100" value="80"></label>
  <div class="playback-seek"><button id="rewind" type="button" aria-label="Go to beginning" disabled>|&lt;</button>
  <input id="seek" type="range" min="0" max="0" step="0.001" value="0" aria-label="Playback position" disabled>
  <output id="playbackTime">0:00 / 0:00</output></div></div>
</section>
<dialog id="mixerDialog" aria-label="Mixer"><div class="mixer-heading">Mixer <button id="closeMixer" type="button" aria-label="Close mixer">×</button></div>
<div style="max-height:45vh;overflow:auto"><table><thead><tr><th>Part</th><th>Volume</th><th>Pan (L ↔ R)</th><th>Mute</th><th>Solo</th></tr></thead><tbody id="mixerRows"></tbody></table></div></dialog>
<style>
#pages { padding-bottom:var(--playback-padding, 110px) }
#playback { position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:8px 16px;z-index:2 }
.playback-transport,.playback-position { display:flex;align-items:center;gap:12px;flex-wrap:wrap }
.playback-position { margin-top:6px }
.playback-seek { display:flex;align-items:center;gap:8px;flex:1 1 24rem;max-width:66vw;min-width:0 }
#seek { flex:1;min-width:0;width:100% }
#playbackTime { white-space:nowrap;font-variant-numeric:tabular-nums }
#masterVolume { max-width:130px;min-width:60px }
#playback button { min-height:32px }
#mixerDialog { position:fixed;top:auto;bottom:100px;left:auto;right:16px;margin:0;max-width:calc(100vw - 48px);border:1px solid #bbb;border-radius:8px;z-index:10;background:white }
.mixer-heading { display:flex;justify-content:space-between;align-items:center;margin-bottom:8px }
#mixerDialog th { text-align:left;padding-right:12px } #mixerDialog td { padding:3px 8px }
#mixerDialog input[type=range] { width:110px;max-width:20vw }
@media(max-width:760px) { #playback { padding:8px } .playback-seek { flex-basis:100%;max-width:none } }
</style>
<!-- PLAYBACK_END -->

<script type="module">
import { load, SYMBOLS_FONT, SYMBOLS_PATH, FONTS_REFERENCE, FONTS_EMBED } from './mscz.js'
import { downloadScorePdf } from './pdf-export.js'
import { defaultFontResolver } from './font-resolver.js'
// PLAYBACK_BEGIN
import { attachPlayback } from './playback-ui.js'
let playback
// PLAYBACK_END

const status = document.getElementById('status')
const pages = document.getElementById('pages')
const drop = document.getElementById('drop')
// PLAYBACK_BEGIN
const showPlayback = document.getElementById('showPlayback')
showPlayback.addEventListener('change', () => {
  document.getElementById('playback').hidden = !showPlayback.checked
  if (!showPlayback.checked) {
    document.getElementById('mixerDialog').close()
    document.getElementById('showMixer').setAttribute('aria-expanded', 'false')
  }
  pages.style.setProperty('--playback-padding', showPlayback.checked ? '110px' : '16px')
})
// PLAYBACK_END

let mscz = null
let score = null
let busy = false
let scoreName = 'score'
const pdfFonts = defaultFontResolver()
const savePdf = document.getElementById('savePdf')
savePdf.addEventListener('click', async () => {
  if (!score || busy) return
  busy = true
  updateTransposeControls()
  try {
    await downloadScorePdf(score, { fontResolver: pdfFonts, title: scoreName,
      filename: `${scoreName.replace(/\.(mscz|musicxml|xml|mxl)$/i, '')}.pdf`,
      onProgress: message => { status.textContent = message } })
    status.textContent = 'PDF saved (searchable text, embedded font subsets)'
  } catch (error) {
    status.textContent = `Could not save PDF: ${error.message}`
  } finally {
    busy = false
    updateTransposeControls()
  }
})
let zoom = 100

function updateZoom () {
  pages.style.setProperty('--page-width', `${Math.max(1, document.documentElement.clientWidth - 32) * zoom / 100}px`)
  document.getElementById('zoomValue').textContent = `${zoom}%`
  document.getElementById('zoomOut').disabled = zoom <= 25
  document.getElementById('zoomIn').disabled = zoom >= 400
  // PLAYBACK_BEGIN
  playback?.refresh()
  // PLAYBACK_END
}

function setZoom (value) {
  zoom = Math.max(25, Math.min(400, value))
  updateZoom()
}

document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoom - 25))
document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoom + 25))
document.getElementById('zoomReset').addEventListener('click', () => {
  setZoom(100)
  window.scrollTo({ left: 0 })
})
window.addEventListener('resize', updateZoom)
updateZoom()

function updateTransposeControls () {
  savePdf.disabled = !score || busy
  // PLAYBACK_BEGIN
  playback?.setBusy(busy)
  // PLAYBACK_END
  const offset = score ? score.viewTransposeSemitones : 0
  document.getElementById('transposeValue').textContent = offset === 0 ? 'Original key' : `${offset > 0 ? '+' : ''}${offset} semitone${Math.abs(offset) === 1 ? '' : 's'}`
  document.getElementById('transposeDown').disabled = !score || busy || offset <= -12
  document.getElementById('transposeUp').disabled = !score || busy || offset >= 12
  document.getElementById('transposeReset').disabled = !score || busy || offset === 0
  document.getElementById('transposeSpelling').disabled = !score || busy
  if (score) { document.getElementById('transposeSpelling').value = score.viewTransposeSpelling }
  document.getElementById('preserveSystemBreaks').disabled = !score || busy
  if (score && !busy) { document.getElementById('preserveSystemBreaks').checked = score.viewPreserveSystemBreaks }
  document.getElementById('file').disabled = !mscz || busy
}

const t0 = performance.now()
const textFonts = new URLSearchParams(location.search).get('textFonts') || 'browser'
try {
  mscz = await load({ base: '.', textFonts })
  // PLAYBACK_BEGIN
  playback = attachPlayback(mscz, '@MSCZ_PLAYBACK@')
  // PLAYBACK_END
  updateTransposeControls()
  status.textContent = `engine ready in ${Math.round(performance.now() - t0)} ms`
            + ` (${(mscz.resourceBytes / 1024).toFixed(0)} KB of resources)`
} catch (e) {
  status.textContent = `could not start the engine: ${e.message}`
  throw e
}

function options () {
  return {
    dpi: Number(document.getElementById('dpi').value) || 300,
    symbols: document.getElementById('pathSymbols').checked ? SYMBOLS_PATH : SYMBOLS_FONT,
    fonts: document.getElementById('embedFonts').checked ? FONTS_EMBED : FONTS_REFERENCE
  }
}

let nextSvgPage = 0

function isolatePage (svg) {
  // Inline SVG shares IDs and @font-face names with the whole HTML document.
  // Each page has different glyph definitions and different font subsets.
  const prefix = `mscz-page-${nextSvgPage++}`
  const ids = new Map([...svg.querySelectorAll('[id]')].map(e => [e.id, `${prefix}-${e.id}`]))
  const families = new Map()
  const fontFamily = /font-family:"([^"]+)"/g
  for (const style of svg.querySelectorAll('style')) {
    style.textContent = style.textContent.replace(fontFamily, (_, family) => {
      if (!families.has(family)) families.set(family, `${prefix}-font-${families.size}`)
      return `font-family:"${families.get(family)}"`
    })
  }
  for (const element of [svg, ...svg.querySelectorAll('*')]) {
    for (const attribute of [...element.attributes]) {
      if (attribute.name === 'id') {
        attribute.value = ids.get(attribute.value) || attribute.value
      } else if (attribute.localName === 'href' && attribute.value.startsWith('#')) {
        attribute.value = `#${ids.get(attribute.value.slice(1)) || attribute.value.slice(1)}`
      } else if (attribute.name === 'font-family' && families.has(attribute.value)) {
        attribute.value = families.get(attribute.value)
      } else {
        attribute.value = attribute.value.replace(/url\(#([^)]*)\)/g, (match, id) =>
          ids.has(id) ? `url(#${ids.get(id)})` : match)
      }
    }
  }
  return svg
}

function render () {
  if (!score) { return }
  pages.textContent = ''

  const start = performance.now()
  let bytes = 0
  for (let i = 0; i < score.pageCount; ++i) {
    const svg = score.pageSvg(i, options())
    bytes += svg.length
    // Parsed rather than assigned, so each page is a real SVG document
    // element and the text in it stays selectable.
    const doc = new DOMParser().parseFromString(svg, 'image/svg+xml')
    const element = isolatePage(document.importNode(doc.documentElement, true))
    element.dataset.playbackPage = i
    pages.append(element)
  }

  // PLAYBACK_BEGIN
  playback?.refresh()
  // PLAYBACK_END
  status.textContent = `${score.pageCount} page(s), ${(bytes / 1024).toFixed(0)} KB of SVG,`
            + ` drawn in ${Math.round(performance.now() - start)} ms`
}

async function openFile (file) {
  if (!mscz || busy) { return }
  // PLAYBACK_BEGIN
  playback?.stop()
  // PLAYBACK_END
  busy = true
  updateTransposeControls()
  status.textContent = `opening ${file.name}…`
  try {
    adoptScore(mscz.open(new Uint8Array(await file.arrayBuffer()), file.name), file.name)
  } catch (e) {
    status.textContent = `${file.name}: ${e.message}`
  } finally {
    busy = false
    updateTransposeControls()
  }
}

function adoptScore (next, name = 'score') {
  scoreName = name
  // PLAYBACK_BEGIN
  playback?.setScore(null)
  // PLAYBACK_END
  if (score) { score.close() }
  score = next
  // PLAYBACK_BEGIN
  playback?.setScore(score)
  // PLAYBACK_END
  drop.hidden = true
  window.__mscz = { mscz, score }
  // PLAYBACK_BEGIN
  window.__mscz.playback = playback.player
  // PLAYBACK_END
  render()
  updateTransposeControls()
}

async function transposeTo (semitones, spelling = score?.viewTransposeSpelling, preserveSystemBreaks = score?.viewPreserveSystemBreaks) {
  if (!score || busy) { return }
  // PLAYBACK_BEGIN
  playback?.stop()
  // PLAYBACK_END
  busy = true
  updateTransposeControls()
  status.textContent = 'Transposing…'
  // Let the busy state appear before the synchronous engine/layout work.
  await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)))
  try {
    score.setViewTransposeSemitones(semitones, spelling, preserveSystemBreaks)
    // PLAYBACK_BEGIN
    playback?.setScore(score, true)
    // PLAYBACK_END
    render()
  } catch (e) {
    status.textContent = `Could not transpose: ${e.message}`
  } finally {
    busy = false
    updateTransposeControls()
  }
}

document.getElementById('transposeDown').addEventListener('click', () => transposeTo(score.viewTransposeSemitones - 1))
document.getElementById('transposeUp').addEventListener('click', () => transposeTo(score.viewTransposeSemitones + 1))
document.getElementById('transposeReset').addEventListener('click', () => transposeTo(0))
document.getElementById('transposeSpelling').addEventListener('change', e => transposeTo(score.viewTransposeSemitones, e.target.value))
document.getElementById('preserveSystemBreaks').addEventListener('change', e => transposeTo(score.viewTransposeSemitones, score.viewTransposeSpelling, e.target.checked))

document.getElementById('file').addEventListener('change', e => {
  if (e.target.files[0]) { openFile(e.target.files[0]) }
  e.target.value = '' // Allow selecting the same score again to reset it.
})

for (const id of ['dpi', 'pathSymbols', 'embedFonts']) {
  document.getElementById(id).addEventListener('change', render)
}

// ?score=<url> loads one straight away, which is how the headless check drives
// the page -- a file input cannot be filled from the command line.
const wanted = new URLSearchParams(location.search).get('score')
if (wanted) {
  try {
    const res = await fetch(wanted)
    if (!res.ok) { throw new Error(`${res.status} ${res.statusText}`) }
    const bytes = new Uint8Array(await res.arrayBuffer())
    const name = decodeURIComponent(new URL(wanted, location.href).pathname.split('/').pop())
    adoptScore(mscz.open(bytes, name), name)
  } catch (e) {
    status.textContent = `${wanted}: ${e.message}`
  }
}

document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging') })
document.addEventListener('dragleave', () => document.body.classList.remove('dragging'))
document.addEventListener('drop', e => {
  e.preventDefault()
  document.body.classList.remove('dragging')
  if (e.dataTransfer.files[0]) { openFile(e.dataTransfer.files[0]) }
})
</script>
</body>
</html>
